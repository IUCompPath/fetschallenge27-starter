[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fets27-nvflare-task2"
version = "0.1.0"
description = "FeTS27 Task 2 NVFLARE brain-tumor classification baseline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "FeTS Challenge Organizers" }]

[project.scripts]
fets27-classification = "fets27_classification.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider -p no:tmpdir"
